<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ec">
  <title>과일 종 — 함께하는 카드게임</title>
  <style>
    :root{--ink:#382b2b;--muted:#847572;--cream:#fff8ec;--paper:#fffdf8;--red:#f05252;--yellow:#ffd34e;--green:#4d9c68;--line:#eadfce;--shadow:0 12px 32px #513b2414}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(ellipse at top,#fff0cc 0,#fff8ec 48%,#f8f0e4 100%);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;min-height:100svh}
    button,input{font:inherit} button{cursor:pointer;border:0} .wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
    .brand{text-align:center;margin:8px auto 20px}.logo{font-size:42px;line-height:1}.brand h1{font-size:29px;margin:6px 0 2px;letter-spacing:-1px}.brand p{color:var(--muted);margin:0;font-size:14px}
    .panel{background:var(--paper);border:1px solid #f1e7d6;border-radius:24px;padding:22px;box-shadow:var(--shadow);margin:14px 0}.panel h2{font-size:20px;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 15px;background:white;outline:none;font-size:16px}.field:focus{border-color:#f2ac55;box-shadow:0 0 0 3px #f2ac5520}
    .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.btn{border-radius:15px;padding:14px 16px;font-weight:800;transition:transform .08s,filter .12s}.btn:active{transform:scale(.98)}.primary{background:var(--red);color:white;box-shadow:0 5px 0 #cf3d3d}.secondary{background:#fff0d3;color:#67471c;border:1px solid #f2dfbd}.dark{background:#382b2b;color:white}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.home-actions{display:grid;gap:10px;margin-top:18px}.tip{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;margin:14px 4px 0}
    .codebox{background:#fff3d5;border:1px dashed #e7b963;border-radius:18px;padding:14px;text-align:center;margin:16px 0}.codebox small{display:block;color:#856326;font-weight:700}.code{font-size:30px;font-weight:900;letter-spacing:4px;margin:4px 0;color:#543b19}.copy{background:none;color:#956c25;font-size:13px;text-decoration:underline;padding:5px}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:99px;padding:7px 11px;background:#f4eee4;font-size:12px;font-weight:800;color:#66564d}.status{color:var(--muted);font-size:13px;margin-top:3px}.player-list{display:grid;gap:8px;margin:14px 0}.player-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #f0e9df;border-radius:14px;background:white}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff1d6;font-size:18px}.player-name{font-weight:750;flex:1}.host-tag{font-size:11px;color:#96713b}.turn-tag{font-size:11px;border-radius:99px;background:#ffe3e0;color:#a12f2f;padding:4px 8px;font-weight:800}
    .table{display:grid;gap:10px}.card-row{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:stretch}.card-player{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;display:flex;align-items:center;gap:10px;min-height:76px}.card-player .avatar{flex:none}.card-info{min-width:0}.card-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:12px;color:var(--muted)}.fruit-card{border-radius:17px;background:#fff7e8;border:1px solid #f1dfc3;display:flex;align-items:center;justify-content:center;gap:6px;min-height:76px;font-size:23px;font-weight:900}.fruit-card.empty{color:#d0c7ba;font-size:13px;font-weight:600}.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.total{border:1px solid #eee4d5;border-radius:14px;text-align:center;padding:8px 3px;background:white}.total .emoji{display:block;font-size:19px}.total b{font-size:15px}.total.hot{background:#fff0cf;border-color:#efb84f;box-shadow:inset 0 0 0 1px #efb84f}.callout{text-align:center;padding:12px;border-radius:15px;background:#fff2cd;color:#704b13;font-weight:850;margin:12px 0;animation:pulse 1s infinite alternate}.callout.wait{background:#e8f6eb;color:#25633a;animation:none}.callout.danger{background:#ffe7e4;color:#a43232;animation:none}@keyframes pulse{to{transform:scale(1.015)}}
    .bell{width:100%;padding:20px 12px;border-radius:22px;background:linear-gradient(#ffe47b,#ffc62e);color:#50380d;font-weight:950;font-size:25px;box-shadow:0 7px 0 #dc9f16;margin:10px 0}.bell:active{transform:translateY(4px);box-shadow:0 3px 0 #dc9f16}.actions{display:grid;grid-template-columns:1fr auto;gap:10px}.rule{font-size:12px;line-height:1.6;color:var(--muted);margin:12px 2px 0}.toast{position:fixed;z-index:5;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#382b2b;color:white;padding:12px 18px;border-radius:99px;font-weight:750;box-shadow:var(--shadow);transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.error{color:#bd3737;font-size:13px;margin-top:10px}.hidden{display:none!important}
    @media(max-width:390px){.panel{padding:18px}.card-row{grid-template-columns:1fr 96px}.fruit-card{font-size:20px}.brand h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="wrap"><header class="brand"><div class="logo">🔔</div><h1>과일 종</h1><p>과일이 다섯 개면, 먼저 종을 눌러요!</p></header><div id="app"></div></main><div id="toast" class="toast"></div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
  (()=>{
    const FRUITS=[{key:'strawberry',emoji:'🍓',name:'딸기'},{key:'banana',emoji:'🍌',name:'바나나'},{key:'lemon',emoji:'🍋',name:'레몬'},{key:'grape',emoji:'🍇',name:'포도'}];
    const $=s=>document.querySelector(s), app=$('#app'); let peer=null, hostConn=null, connections=new Map(), state=null, seatId=null, mode='home', toastTimer;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2100)};
    const fruit=k=>FRUITS.find(x=>x.key===k);
    function bellSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[880,1175].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+i*.04);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+i*.04+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+i*.04+.55);o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.04);o.stop(c.currentTime+i*.04+.57)});setTimeout(()=>c.close(),900)}catch(e){}}
    function goHome(){try{hostConn?.close();connections.forEach(c=>c.close());peer?.destroy()}catch(e){}peer=null;hostConn=null;connections=new Map();state=null;seatId=null;mode='home';renderHome()}
    function renderHome(){mode='home';app.innerHTML=`<section class="panel"><h2>플레이어 이름</h2><p class="sub">각자 휴대폰에서 이름을 정하고 같은 방으로 모여요.</p><input class="field" id="name" maxlength="12" placeholder="예: 딸기대장" value="${esc(localStorage.getItem('fruitbell-name')||'')}" autocomplete="nickname"><div class="home-actions"><button class="btn primary" id="make">새 게임 만들기</button><button class="btn secondary" id="showjoin">방 코드로 참가하기</button></div><div id="joinbox" class="hidden"><label for="roomcode">방 코드</label><input class="field" id="roomcode" maxlength="10" placeholder="예: HG4K8P" autocapitalize="characters"><button class="btn dark" id="join" style="width:100%;margin-top:10px">게임 참가</button></div><div id="error" class="error"></div><p class="tip">3~8명 · 모두 인터넷 연결 필요 · 한 명이 방을 만들고 나머지는 코드로 참가</p></section><section class="panel"><h2>게임 방법</h2><p class="sub" style="margin-bottom:0">순서대로 카드를 뒤집어요. 모든 플레이어의 공개 카드에서 <b>같은 과일의 합이 정확히 5개</b>가 되는 순간, 누구든 종을 누를 수 있어요. 먼저 맞힌 사람이 1점을 얻고, 틀리면 1점을 잃어요.</p></section>`;
      $('#make').onclick=createRoom;$('#showjoin').onclick=()=>{$('#joinbox').classList.toggle('hidden');$('#roomcode')?.focus()};$('#join').onclick=joinRoom;$('#roomcode').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));$('#name').addEventListener('input',e=>localStorage.setItem('fruitbell-name',e.target.value.trim())); }
    function getName(){const n=$('#name')?.value.trim()||'';return n||`플레이어${Math.floor(Math.random()*90+10)}`}
    function setError(s){const e=$('#error');if(e)e.textContent=s}
    function randomRoom(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='HG';for(let i=0;i<5;i++)x+=chars[Math.floor(Math.random()*chars.length)];return x}
    function createRoom(){if(!window.Peer){setError('연결 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');return}const hostName=getName();localStorage.setItem('fruitbell-name',hostName);const code=randomRoom();mode='connecting';app.innerHTML='<section class="panel"><h2>게임 방을 만들고 있어요…</h2><p class="sub">잠시만 기다려 주세요.</p></section>';peer=new Peer(code.toLowerCase());peer.on('open',id=>{seatId=id;state={room:code,started:false,players:[{id,name:hostName,score:0,card:null}],active:0,waitingBell:null,notice:'친구들이 참가하면 게임을 시작하세요.',winner:null};mode='host';peer.on('connection',acceptConnection);renderGame()});peer.on('error',e=>{if(e.type==='unavailable-id'){goHome();setError('방 코드가 이미 사용 중이에요. 다시 눌러 새 방을 만들어 주세요.')}else{goHome();setError('방 연결에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.')}})}
    function joinRoom(){if(!window.Peer){setError('연결 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');return}const code=$('#roomcode').value.trim().toUpperCase();if(!code){setError('방 코드를 입력해 주세요.');return}const playerName=getName();localStorage.setItem('fruitbell-name',playerName);mode='connecting';app.innerHTML='<section class="panel"><h2>방에 연결하고 있어요…</h2><p class="sub">잠시만 기다려 주세요.</p><button class="btn secondary" id="cancel">취소</button></section>';$('#cancel').onclick=goHome;peer=new Peer();peer.on('open',()=>{hostConn=peer.connect(code.toLowerCase(),{reliable:true});hostConn.on('open',()=>hostConn.send({type:'join',name:playerName}));hostConn.on('data',onClientMessage);hostConn.on('error',()=>{goHome();setError('방 연결이 끊겼어요. 방 코드를 확인해 주세요.')});hostConn.on('close',()=>{if(mode==='client'){toast('방 연결이 종료됐어요.');goHome()}})});peer.on('error',e=>{goHome();setError(e.type==='peer-unavailable'?'그 방을 찾을 수 없어요. 코드와 방 만든 사람의 연결 상태를 확인해 주세요.':'연결에 실패했어요. 인터넷 연결을 확인해 주세요.')})}
    function acceptConnection(conn){conn.on('data',msg=>{if(msg?.type==='join'){if(state.started){conn.send({type:'reject',reason:'게임이 이미 시작됐어요.'});conn.close();return}if(state.players.length>=8){conn.send({type:'reject',reason:'최대 8명까지 참가할 수 있어요.'});conn.close();return}if(state.players.some(p=>p.id===conn.peer)){conn.send({type:'reject',reason:'이미 참가한 기기예요.'});conn.close();return}state.players.push({id:conn.peer,name:String(msg.name||'플레이어').slice(0,12),score:0,card:null});connections.set(conn.peer,conn);conn.on('close',()=>removePlayer(conn.peer));conn.send({type:'welcome',seat:conn.peer,state});broadcast();toast(`${msg.name||'새 플레이어'} 참가!`);return}if(msg?.type==='flip')hostAction(conn.peer,'flip');if(msg?.type==='bell')hostAction(conn.peer,'bell')});conn.on('error',()=>removePlayer(conn.peer))}
    function removePlayer(id){if(!state)return;const ix=state.players.findIndex(p=>p.id===id);if(ix<0)return;state.players.splice(ix,1);connections.delete(id);if(state.players.length){if(ix<state.active)state.active--;state.active%=state.players.length}else state.active=0;broadcast();renderGame()}
    function onClientMessage(msg){if(msg?.type==='welcome'){seatId=msg.seat;state=msg.state;mode='client';renderGame()}else if(msg?.type==='state'){state=msg.state;renderGame()}else if(msg?.type==='reject'){goHome();setError(msg.reason||'방에 참가할 수 없어요.')}else if(msg?.type==='bell-sound'){bellSound();navigator.vibrate?.(60)}}
    function broadcast(event){if(!state)return;const packet={type:'state',state};connections.forEach(c=>{if(c.open)c.send(packet)});if(event==='bell-sound'){bellSound();navigator.vibrate?.(60);connections.forEach(c=>{if(c.open)c.send({type:'bell-sound'})})}renderGame()}
    function startGame(){if(state.players.length<3){toast('최소 3명이 참가해야 시작할 수 있어요.');return}state.started=true;state.notice='게임 시작! 내 차례에 카드를 뒤집으세요.';state.active=0;state.waitingBell=null;state.winner=null;broadcast()}
    function currentFruitTotals(){const totals={};FRUITS.forEach(f=>totals[f.key]=0);state.players.forEach(p=>{if(p.card)totals[p.card.fruit]+=p.card.count});return totals}
    function hostAction(id,action){if(!state||!state.started||state.winner)return;const p=state.players.find(x=>x.id===id);if(!p)return;if(action==='flip'){if(state.waitingBell)return;if(state.players[state.active]?.id!==id){if(id===seatId)toast('아직 내 차례가 아니에요.');return}const f=FRUITS[Math.floor(Math.random()*FRUITS.length)];p.card={fruit:f.key,count:Math.floor(Math.random()*5)+1};state.active=(state.active+1)%state.players.length;const totals=currentFruitTotals();const hit=FRUITS.find(x=>totals[x.key]===5);state.waitingBell=hit?hit.key:null;state.notice=hit?`${hit.name}이(가) 정확히 5개! 종을 누르세요!`:`${p.name} 카드 공개`;broadcast();return}if(action==='bell'){if(state.waitingBell){p.score++;const f=fruit(state.waitingBell);state.notice=`${p.name}님 정답! ${f.name} 5개를 찾아 1점 획득`;state.players.forEach(player=>player.card=null);state.waitingBell=null;broadcast('bell-sound');if(p.score>=5){state.winner=p.id;state.notice=`🎉 ${p.name}님이 5점을 먼저 얻어 승리했어요!`;broadcast()}return}else{p.score=Math.max(0,p.score-1);state.notice=`${p.name}님 오답! 1점 감점`;broadcast();return}}}
    function sendAction(action){if(mode==='host')hostAction(seatId,action);else if(mode==='client'&&hostConn?.open)hostConn.send({type:action})}
    function renderGame(){if(!state)return;const isHost=mode==='host',me=state.players.find(p=>p.id===seatId),active=state.players[state.active],totals=currentFruitTotals(),playerRows=state.players.map((p,i)=>`<div class="player-row"><div class="avatar">${['🍎','🍊','🍐','🍑','🥝','🍒','🥭','🫐'][i%8]}</div><div class="player-name">${esc(p.name)} ${p.id===seatId?'<span class="host-tag">(나)</span>':''} ${p.id===state.players[0].id?'<span class="host-tag">방장</span>':''}</div><span class="score">${p.score}점</span>${state.started&&active?.id===p.id&&!state.waitingBell&&!state.winner?'<span class="turn-tag">차례</span>':''}</div>`).join('');
      const cards=state.players.map((p,i)=>`<div class="card-row"><div class="card-player"><div class="avatar">${['🍎','🍊','🍐','🍑','🥝','🍒','🥭','🫐'][i%8]}</div><div class="card-info"><strong>${esc(p.name)}${p.id===seatId?' · 나':''}</strong><span class="score">${p.score}점</span></div></div>${p.card?`<div class="fruit-card">${fruit(p.card.fruit).emoji.repeat(p.card.count)}</div>`:'<div class="fruit-card empty">카드 없음</div>'}</div>`).join('');
      const canFlip=state.started&&!state.waitingBell&&!state.winner&&active?.id===seatId;const canStart=isHost&&!state.started&&state.players.length>=3;const phase=state.winner?`<div class="callout wait">🏆 ${esc(state.players.find(p=>p.id===state.winner)?.name||'플레이어')} 승리!</div>`:state.waitingBell?`<div class="callout">${fruit(state.waitingBell).emoji} ${fruit(state.waitingBell).name}이(가) 정확히 5개! 지금 종을 누르세요!</div>`:state.started?`<div class="callout wait">${active?`현재 차례: ${esc(active.name)}`:'게임 진행 중'}</div>`:`<div class="callout wait">${state.players.length<3?`참가자 기다리는 중 · ${state.players.length}/3명`:'준비 완료! 방장이 시작해 주세요.'}</div>`;
      app.innerHTML=`<section class="panel"><div class="topline"><div><strong>${state.started?'게임 중':'대기실'}</strong><div class="status">${state.started?'플레이어 '+state.players.length+'명':isHost?'친구에게 방 코드를 알려주세요':'방장과 연결됨'}</div></div><span class="pill">${esc(state.room)}</span></div>${isHost?`<div class="codebox"><small>친구에게 이 방 코드를 알려주세요</small><div class="code">${esc(state.room)}</div><button class="copy" id="copy">코드 복사</button></div>`:''}<div class="player-list">${playerRows}</div>${canStart?'<button class="btn primary" id="start" style="width:100%">3명 이상 모였어요 · 게임 시작</button>':''}${!state.started&&!isHost?'<p class="tip">방장이 참가자를 기다리는 중이에요.</p>':''}</section>
      <section class="panel"><div class="topline"><h2 style="margin:0">공개된 카드</h2><span class="pill">5점 먼저 승리</span></div><div class="totals">${FRUITS.map(f=>`<div class="total ${state.waitingBell===f.key?'hot':''}"><span class="emoji">${f.emoji}</span><b>${totals[f.key]}개</b></div>`).join('')}</div><div class="table">${cards||'<p class="sub">플레이어가 참가하면 카드가 보여요.</p>'}</div>${phase}${state.started&&!state.winner?`<div class="actions"><button class="btn primary" id="flip" ${canFlip?'':'disabled'}>${canFlip?'내 카드 뒤집기':'다음 차례 기다리는 중'}</button><button class="btn secondary" id="bell">🔔 종!</button></div>`:''}<p class="rule">같은 과일의 공개 카드 합계가 정확히 5개일 때만 정답이에요. 종을 잘못 누르면 1점 감점됩니다. 첫 5점 승리.</p></section><button class="btn secondary" id="leave" style="width:100%">나가기</button>`;
      $('#start')?.addEventListener('click',startGame);$('#flip')?.addEventListener('click',()=>sendAction('flip'));$('#bell')?.addEventListener('click',()=>{navigator.vibrate?.(45);sendAction('bell')});$('#leave')?.addEventListener('click',goHome);$('#copy')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(state.room);toast('방 코드를 복사했어요')}catch(e){toast('방 코드: '+state.room)}})
    }
    renderHome();
  })();
  </script>
</body>
</html>
